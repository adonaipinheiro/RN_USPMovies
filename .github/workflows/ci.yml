name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

# Only keep the latest run per branch/PR — a new push cancels the one still
# running for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Lint
        run: yarn lint

      - name: Unit tests
        # jest.config.js pins coverageThreshold at 100% — this step fails the
        # build if coverage drops below it.
        run: yarn test --coverage --ci
