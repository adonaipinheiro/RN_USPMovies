buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// E2E (Detox): o AAR nativo do Detox (com.wix:detox) não é publicado em
// nenhum repositório remoto — ele vem dentro do pacote npm, como um
// repositório Maven local em node_modules/detox/Detox-android. google() e
// mavenCentral() já são adicionados pelo plugin do React Native.
// `includeGroup` limita esse repositório ao grupo com.wix, pra não atrasar a
// resolução de todas as outras dependências.
allprojects {
    repositories {
        maven {
            url("${rootDir}/../node_modules/detox/Detox-android")
            content {
                includeGroup "com.wix"
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
